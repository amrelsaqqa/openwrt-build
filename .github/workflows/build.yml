name: Build OpenWrt image from exact commit

on:
  workflow_dispatch:
    inputs:
      openwrt_commit:
        description: "Full OpenWrt git commit SHA"
        required: true
        default: "a65ca44cb7a3e6fbb43b230c7c5a0684d88bae8b"
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Validate commit and clone exact OpenWrt source
        shell: bash
        run: |
          set -euxo pipefail
          SHA="${{ inputs.openwrt_commit }}"
          if [[ ! "$SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "openwrt_commit must be a full 40-character SHA" >&2
            exit 1
          fi
          git clone https://github.com/openwrt/openwrt.git openwrt
          git -C openwrt fetch --no-tags origin "$SHA"
          git -C openwrt checkout --detach FETCH_HEAD
          ACTUAL="$(git -C openwrt rev-parse HEAD)"
          test "${ACTUAL,,}" = "${SHA,,}"
          echo "OPENWRT_COMMIT=$ACTUAL" >> "$GITHUB_ENV"
          {
            echo "## Source revision"
            echo ""
            echo "\`$ACTUAL\`"
            echo ""
            git -C openwrt show -s --format='%ci%n%s' HEAD
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib \
            g++-multilib gettext git libncurses-dev libssl-dev \
            python3-distutils rsync unzip zlib1g-dev file wget \
            libelf-dev ecj fastjar java-propose-classpath \
            python3 python3-setuptools qemu-utils

      - name: Update and install package feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure ramips/mt7621 initramfs image
        working-directory: openwrt
        shell: bash
        run: |
          set -euxo pipefail
          cat > .config <<'EOF'
          CONFIG_TARGET_ramips=y
          CONFIG_TARGET_ramips_mt7621=y
          CONFIG_TARGET_ramips_mt7621_DEVICE_asus_rt-ax54=y
          CONFIG_TARGET_ROOTFS_INITRAMFS=y
          CONFIG_TARGET_ROOTFS_SQUASHFS=y
          EOF
          make defconfig
          grep -E '^(CONFIG_TARGET_ramips=y|CONFIG_TARGET_ramips_mt7621=y|CONFIG_TARGET_ramips_mt7621_DEVICE_asus_rt-ax54=y|CONFIG_TARGET_ROOTFS_INITRAMFS=y)' .config
          {
            echo "## Build configuration"
            echo ""
            echo "- Target: \`ramips/mt7621\`"
            echo "- Profile: \`asus_rt-ax54=\` (ASUS RT AX54)"
            echo "- Image type: initramfs"
            echo "- OpenWrt source commit: \`$OPENWRT_COMMIT\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Download sources
        working-directory: openwrt
        run: make download -j"$(nproc)"

      - name: Build
        working-directory: openwrt
        run: make -j"$(nproc)" V=s

      - name: Verify kernel version and collect build metadata
        working-directory: openwrt
        shell: bash
        run: |
          set -euxo pipefail

          echo "Kernel version declaration:"
          grep -n '^LINUX_VERSION-6.6' include/kernel-6.6
          grep -Eq '^LINUX_VERSION-6\.6[[:space:]]*=[[:space:]]*\.102$' include/kernel-6.6
          echo "Verified: Linux 6.6.102"

          IMAGE_DIR="bin/targets/ramips/mt7621"

          echo "Available ASUS RT-AX54 images:"
          find "$IMAGE_DIR" -maxdepth 1 -type f \
            \( -name '*asus_rt-ax54*' -o -name '*initramfs*' \) -print

          INITRAMFS="$(find "$IMAGE_DIR" -maxdepth 1 -type f \
            -name '*asus_rt-ax54*initramfs*' -print -quit)"

          SYSUPGRADE="$(find "$IMAGE_DIR" -maxdepth 1 -type f \
            -name '*asus_rt-ax54*sysupgrade*' -print -quit)"

          test -n "$INITRAMFS"
          test -n "$SYSUPGRADE"

          mkdir -p ../build-metadata

          cp "$IMAGE_DIR"/version.buildinfo ../build-metadata/ 2>/dev/null || true
          cp "$IMAGE_DIR"/config.buildinfo ../build-metadata/ 2>/dev/null || true
          cp "$IMAGE_DIR"/feeds.buildinfo ../build-metadata/ 2>/dev/null || true

          git rev-parse HEAD > ../build-metadata/openwrt-commit.txt

          {
            echo "## Generated images"
            echo ""
            echo "- Initramfs: $(basename "$INITRAMFS")"
            echo "- Sysupgrade: $(basename "$SYSUPGRADE")"
          } >> "$GITHUB_STEP_SUMMARY"

          sha256sum "$INITRAMFS" "$SYSUPGRADE" \
            > ../build-metadata/image-sha256sums.txt

            
      - name: Upload initramfs, sysupgrade and build metadata
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-ramips-mt7621-${{ inputs.openwrt_commit }}
          path: |
            openwrt/bin/targets/ramips/mt7621/*initramfs*
            openwrt/bin/targets/ramips/mt7621/*sysupgrade*
            openwrt/bin/targets/ramips/mt7621/version.buildinfo
            openwrt/bin/targets/ramips/mt7621/config.buildinfo
            openwrt/bin/targets/ramips/mt7621/feeds.buildinfo
            build-metadata/
          if-no-files-found: error
          retention-days: 30
